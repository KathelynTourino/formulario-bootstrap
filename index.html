<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Formulario bootstrap</title>
</head>
<body>
    <div class="container py-4">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title text-center">Formulário - Mostra de Tecnologia e Inovação</h1>
                <form>
                    <fieldset class="mb-4">
                        <legend>Identificação do participante</legend>
                        <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo:</label>
                        <input type="text" class="form-control" id="nome" name="nome" 
                        placeholder="Digite seu nome completo" required minlength="3" maxlength="100">
                        </div>

                        <div class="mb-3">
                        <label for="idade" class="form-label">Idade:</label>
                        <input type="number" class="form-control" id="idade" name="idade" 
                        placeholder="Digite sua idade" required min="10" max="100">
                        </div>

                        <div class="mb-3">
                       <label for="data" class="form-label">Data de nascimento:</label>
                       <input type="date" class="form-control" id="data"name="data" required>
                    </fieldset>

                    <fieldset class="mb-4">
                        <legend>Dados de Contato</legend>
                        <div class="mb-3">
                        <label for="email" class="form-label">E-mail:</label>
                        <input type="email" class="form-control" id="email" name="email" 
                        placeholder="Digite seu e-mail" required>
                        </div>

                        <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone:</label>
                        <input type="tel" class="form-control" id="telefone" name="telefone" 
                        placeholder="Digite seu telefone" required pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}">
                        </div>

                        <div class="mb-3">
                        <label for="pesquisa" class="form-label">Pesquisar área de interesse:</label>
                        <input type="search" class="form-control" id="pesquisa" name="pesquisa" 
                        placeholder="Digite a área de interesse" required>
                        </div>
                    </fieldset>

                    <fieldset class="mb-4">
                        <legend>Formação e experiência</legend>
                        <div class="mb-3">
                        <label for="curso" class="form-label">Curso:</label>
                        <select class="form-select" id="curso" name="curso" required>
                            <option value="">Selecione seu curso</option>
                            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                            <option value="gestao">Gestão de TI</option>
                            <option value="engenharia">Engenharia de Software</option>
                           <option value="outro">Outro</option>
                        </select>
                        </div>

                        <div class="mb-3">
                            <label for="experiencia" class="form-label">Conte sua experiência:</label>
                            <textarea class="form-control" id="experiencia" name="experiencia" 
                            rows="4" placeholder="Descreva brevemente sua experiência profissional"></textarea>
                        </div>
                    </fieldset>

                    <fieldset class="mb-4">
                        <legend>Datas e disponibilidade</legend>
                        <div class="mb-3">
                        <label for="mes" class="form-label">Mês de participação:</label>
                        <input type="month" class="form-control" id="mes" name="mes" required>
                        </div>

                        <div class="mb-3">
                        <label for="semana" class="form-label">Semana disponível</label>
                        <input type="week" class="form-control" id="semana" name="semana">
                        </div>

                        <div class="mb-3">
                        <label for="horario" class="form-label">Horário preferencial</label>
                        <input type="time" class="form-control" id="horario" name="horario">
                        </div>

                        <div class="mb-3">
                        <label for="datahora" class="form-label">Data e horário da apresentação</label>
                        <input type="datetime-local" class="form-control" id="datahora" name="datahora">
                        </div>
                    </fieldset>

                    <fieldset class="mb-4">
                        <legend>Preferências</legend>

                        <p>Tipo de participação:</p>
                        <div class="form-check">
                        <input class="form-check-input" type="radio" id="participante" name="tipo" value="participante" required>
                        <label class="form-check-label" for="participante">Participante</label>
                        </div>

                        <div class="form-check">
                        <input class="form-check-input" type="radio" id="visitante" name="tipo" value="visitante">
                        <label class="form-check-label" for="visitante">Visitante</label>
                        </div>
                        
                        <p>Áreas de interesse:</p>
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="programacao" name="interesses" value="programacao">
                        <label class="form-check-label" for="programacao">Programação</label>
                        </div>

                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="robotica" name="interesses" value="robotica">
                        <label class="form-check-label" for="robotica">Robótica</label>
                        </div>

                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ia" name="interesses" value="ia">
                        <label class="form-check-label" for="ia">Inteligência Artificial</label>
                        </div>

                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="design" name="interesses" value="design">
                        <label class="form-check-label" for="design">Design</label>
                        </div>

                        <div class="mt-3">
                        <label for="cor" class="form-label">Cor preferida para identificação</label>
                        <input type="color" id="cor" name="cor" value="#3530c6">
                        </div>

                        <div class="mt-3">
                        <label for="interesse" class="form-label">Nível de interesse: <span id="valorInteresse">5</span></label>
                        <input type="range" class="form-range" id="interesse" name="interesse" min="0" max="10" step="1" value="5">
                        </div>
                    </fieldset>
                    
                    <fieldset class="mb-4">
                        <legend>Informações sobre o projeto</legend>
                        <div class="mb-3">
                        <label for="projeto" class="form-label">Nome do projeto</label>
                        <input type="text" class="form-control" id="projeto" name="projeto" placeholder="Digite o nome do projeto" required>
                        </div>

                        <div class="mb-3">
                        <label for="area" class="form-label">Área do projeto</label>
                        <input class="form-control" list="areas" id="area" name="area" placeholder="Escolha ou digite uma área">
                           <datalist id="areas">
                                <option value="Inteligência Artificial">
                                <option value="Programação">
                                <option value="Robótica">
                                <option value="Desenvolvimento Web">
                                <option value="Tecnologia da Informação">
                           </datalist>
                        </div>

                        <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição do projeto</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="5" maxlength="500"
                        placeholder="Descreva seu projeto..."></textarea>
                        </div>

                        <div class="mb-3">
                        <label for="arquivo" class="form-label">Arquivo do projeto</label>
                        <input type="file" class="form-control" id="arquivo" name="arquivo" accept=".pdf,.ppt,.pptx,.zip">
                        </div>

                        <div class="mb-3">
                        <label for="senha" class="form-label">Código de acesso</label>
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite um código fictício">

                        <div class="form-text">Não utilize uma senha real neste formulário.</div>
                    </fieldset>

                    <div class="d-flex gap-2">
                        <input type="submit" class="btn btn-primary" value="Enviar inscrição">

                        <input type="reset" class="btn btn-secondary" value="Limpar">

                        <button type="button" class="btn btn-outline-dark">Salvar rascunho</button>

                        <input type="image" src="img/enviar.png" alt="Enviar" width="50">
                    </div>

                </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
